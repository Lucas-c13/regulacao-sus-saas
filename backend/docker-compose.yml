services:
  # 1. Base de Dados Principal (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: agendamento_db
    restart: always
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Mensageiro para Background Tasks (Redis)
  redis:
    image: redis:7-alpine
    container_name: agendamento_redis
    restart: always
    ports:
      - "6379:6379"
    # Guarda os dados no disco a cada 60 segundos caso o contentor reinicie
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: