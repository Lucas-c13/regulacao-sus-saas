version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agendamento_db
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: agendamento_redis
    restart: always
    ports:
      - "6379:6379"

  # 👇 ADICIONE ESTE BLOCO AQUI 👇
  api:
    build: .
    container_name: regulacao_sus_api
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    # Garante que a API consegue falar com o DB usando o nome do serviço
    environment:
      # ANTES:
      # - DATABASE_URL=postgresql://admin:admin_password@db:5432/db_regulacao
      
      # DEPOIS:
      - DATABASE_URL=postgresql+asyncpg://admin:admin_password@db:5432/db_regulacao

volumes:
  postgres_data: